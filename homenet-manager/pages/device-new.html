<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HomeNet Manager · Nuevo Dispositivo</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>

  <div class="d-flex">
    <nav class="hn-sidebar" id="hn-sidebar"></nav>

    <div class="hn-main">
      <header class="hn-topbar" id="hn-topbar" data-title="Nuevo Dispositivo" data-add-button="false"></header>

      <main class="hn-content">
        <nav aria-label="breadcrumb" class="mb-4">
          <ol class="breadcrumb small mb-0">
            <li class="breadcrumb-item"><a href="dashboard.html" class="text-decoration-none">Inicio</a></li>
            <li class="breadcrumb-item"><a href="devices.html" class="text-decoration-none">Dispositivos</a></li>
            <li class="breadcrumb-item active">Nuevo</li>
          </ol>
        </nav>

        <div class="hn-card p-0 mx-auto" style="max-width:720px;">
          <div class="form-card-header">
            <i class="bi bi-phone fs-4"></i>
            <div>
              <div class="fw-bold">Registrar dispositivo</div>
              <div class="small" style="color:#c7cff0;">Completa la información del dispositivo móvil</div>
            </div>
          </div>

          <form id="deviceForm" class="p-4">
            <input type="hidden" id="estadoDispositivo" value="confirmado">

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label-hn d-block mb-1">Dispositivo — Andrés</label>
                <select class="form-select form-select-sm">
                  <option>Andrés García</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label-hn d-block mb-1">Dispositivo — Juan</label>
                <select class="form-select form-select-sm">
                  <option>Juan Martínez</option>
                </select>
              </div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label-hn d-block mb-1">Nombre del dispositivo</label>
                <input type="text" class="form-control form-control-sm" placeholder="iPhone 14 Pro">
              </div>
              <div class="col-md-6">
                <label class="form-label-hn d-block mb-1">Tipo de dispositivo</label>
                <select class="form-select form-select-sm">
                  <option>Smartphone</option>
                  <option>Laptop</option>
                  <option>Tablet</option>
                  <option>TV</option>
                  <option>Smart Home</option>
                  <option>Gaming</option>
                  <option>Router</option>
                </select>
              </div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label-hn d-block mb-1">Fecha</label>
                <input type="date" class="form-control form-control-sm" value="2026-07-19">
              </div>
              <div class="col-md-6">
                <label class="form-label-hn d-block mb-1">Hora</label>
                <input type="time" class="form-control form-control-sm" value="08:00">
              </div>
            </div>

            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label class="form-label-hn d-block mb-1">Dirección IP</label>
                <input type="text" class="form-control form-control-sm" placeholder="192.168.1.">
              </div>
              <div class="col-md-6">
                <label class="form-label-hn d-block mb-1">Estado</label>
                <div class="d-flex gap-2">
                  <span class="form-status-option selected-confirmado" data-status-option="confirmado">Confirmado</span>
                  <span class="form-status-option" data-status-option="cancelado">Cancelado</span>
                  <span class="form-status-option" data-status-option="bloqueado">Bloqueado</span>
                </div>
              </div>
            </div>

            <div class="d-flex justify-content-end gap-2">
              <a href="devices.html" class="btn btn-outline-secondary btn-sm">Cancelar</a>
              <button type="submit" class="btn btn-hn-primary btn-sm">
                <i class="bi bi-check-circle me-1"></i>Guardar dispositivo
              </button>
            </div>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/main.js"></script>
  <script>
    HN.mountLayout("dispositivos", "");
  </script>
</body>
</html>
